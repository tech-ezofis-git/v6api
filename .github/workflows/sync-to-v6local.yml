name: Sync to v6local (api/)

# Every push to main mirrors this repository into the api/ folder of
# tech-ezofis-git/v6local.
#
# Uses MONOREPO_SYNC_TOKEN (same secret that successfully syncs ezofis-app-v6).
# Requires a classic PAT with `repo` scope, or a fine-grained PAT with
# Contents: Read and Write on tech-ezofis-git/v6local.
# Missing access makes checkout return HTTP 404 "Not Found".

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v6api (source)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Verify sync token can see v6local
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::MONOREPO_SYNC_TOKEN is not set in repo Actions secrets."
            exit 1
          fi
          code=$(curl -sS -o /tmp/repo.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/tech-ezofis-git/v6local")
          echo "GET tech-ezofis-git/v6local => HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::MONOREPO_SYNC_TOKEN cannot access tech-ezofis-git/v6local (HTTP ${code})."
            echo "Grant the PAT Contents Read/Write on v6local (or use a classic PAT with repo scope)."
            echo "GitHub returns 404 when the token lacks access to a private repo."
            cat /tmp/repo.json || true
            exit 1
          fi

      - name: Checkout v6local (target monorepo)
        uses: actions/checkout@v4
        with:
          repository: tech-ezofis-git/v6local
          token: ${{ secrets.MONOREPO_SYNC_TOKEN }}
          path: monorepo
          persist-credentials: true

      - name: Mirror into api/
        run: |
          # Exact mirror of this repo into v6local/api/.
          # Exclude .git and .github so nested workflows are not copied.
          mkdir -p monorepo/api
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            source/ monorepo/api/

      - name: Commit and push
        working-directory: monorepo
        env:
          SOURCE_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name "v6api-sync"
          git config user.email "v6api-sync@users.noreply.github.com"
          git add -A api
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          SUMMARY=$(printf '%s' "$SOURCE_MSG" | head -n 1)
          git commit -m "Sync api/ from v6api@${GITHUB_SHA:0:7}: ${SUMMARY:-manual sync}"
          git push
